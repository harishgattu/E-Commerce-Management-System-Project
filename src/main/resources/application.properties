spring.application.name=ecommerce-management-system
server.port=8080

# Default profile: Change to 'h2' if running locally without a MySQL server running
# Or pass --spring.profiles.active=h2 on the command line
spring.profiles.active=mysql

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.serialization.write-dates-as-timestamps=false

# App specific business settings
ecommerce.tax-rate=0.08
ecommerce.free-shipping-threshold=50.00
ecommerce.standard-shipping-fee=5.00
ecommerce.low-stock-threshold=10
